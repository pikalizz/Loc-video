
name: Build XMedia Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q ./*.zip -d source
          WRAPPER=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Khong tim thay gradlew trong ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XMedia-Scanner-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
